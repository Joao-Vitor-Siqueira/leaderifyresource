logging.pattern.console = ${LOGPATTERN_CONSOLE:%green(%d{HH:mm:ss.SSS}) %blue(%-5level) %red([%thread]) %yellow(%logger{15}) - %msg%n}

#----------------------DB config----------------------

spring.datasource.url=jdbc:mysql://${DATABASE_HOST:localhost}:${DATABASE_PORT:3306}/${DATABASE_NAME:leaderify}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:root}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${HIBERNATE_FORMAT_SQL:true}
spring.jpa.hibernate.ddl-auto=create-drop

#----------------------JWT config----------------------

jwt.secret=${JWT_SECRET:2XZCFnmx0gac6ObN7LVsXtxpT36eCKJBGEbXg3luFuN2}
jwt.expiration=${JWT_EXPIRATION:60000}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION:604800000}
jwt.cookie.secure=false


#----------------------OAuth2 client-credentials config----------------------

spring.security.oauth2.client.registration.compute-client.provider=keycloak
spring.security.oauth2.client.registration.compute-client.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.compute-client.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.compute-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.compute-client.client-authentication-method=client_secret_basic

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URL:http://localhost:8081/realms/leaderify}
compute-client.url=${COMPUTE_URL:http://localhost:8082/calculate}