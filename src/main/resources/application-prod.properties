#----------------------DB config----------------------

spring.datasource.url=jdbc:mysql://${DATABASE_HOST}:${DATABASE_PORT}/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.hibernate.ddl-auto=validate

#----------------------JWT config----------------------

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
jwt.refresh.expiration=${JWT_REFRESH_EXPIRATION}
jwt.cookie.secure=true


#----------------------OAuth2 client-credentials config----------------------

spring.security.oauth2.client.registration.compute-client.provider=keycloak
spring.security.oauth2.client.registration.compute-client.client-id=${KEYCLOAK_CLIENT_ID}
spring.security.oauth2.client.registration.compute-client.client-secret=${KEYCLOAK_CLIENT_SECRET}
spring.security.oauth2.client.registration.compute-client.authorization-grant-type=client_credentials
spring.security.oauth2.client.registration.compute-client.client-authentication-method=client_secret_basic

spring.security.oauth2.client.provider.keycloak.issuer-uri=${KEYCLOAK_ISSUER_URL}
compute-client.url=${COMPUTE_URL}
